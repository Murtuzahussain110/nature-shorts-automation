
name: Daily Tom and Jerry 3D Shorts
run-name: Render private animated cartoon short

on:
  push:
    branches:
      - feature/ayan-coco-cartoon-shorts
    paths:
      - 'main.py'
      - 'blender/**'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libgl1 libxrender1 libxext6 libsm6

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render Tom and Jerry episode and upload privately
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python main.py

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tom-jerry-3d-short-output
          path: output/
          if-no-files-found: ignore
