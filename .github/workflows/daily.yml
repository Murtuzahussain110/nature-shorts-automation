name: Daily Cinematic Urdu Story Shorts

on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  push:
    branches: [main, mobile-cartoon-studio]
    paths:
      - 'main.py'
      - 'blender/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: daily-cinematic-urdu-story
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Create a new-character animated story for visual review
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
          YOUTUBE_UPLOAD_ENABLED: false
        run: python main.py
      - name: Verify MP4 video, audio, subtitles and portrait format
        if: success()
        run: |
          test -s output/daily_story.mp4
          test -s output/subtitles.srt
          python - <<'PY'
          import json, subprocess
          p = subprocess.run(["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", "output/daily_story.mp4"], check=True, capture_output=True, text=True)
          data = json.loads(p.stdout)
          streams = data.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          assert video, "MP4 has no video stream"
          assert audio, "MP4 has no Urdu voice/audio stream"
          assert int(video["width"]) < int(video["height"]), "Video is not portrait 9:16"
          duration = float(data["format"]["duration"])
          assert duration >= 15, f"Video too short: {duration:.2f}s"
          print(f"VERIFIED: {video['width']}x{video['height']}, {duration:.2f}s, video+audio streams, subtitles present")
          PY
      - name: Save generated files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-urdu-story-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7
