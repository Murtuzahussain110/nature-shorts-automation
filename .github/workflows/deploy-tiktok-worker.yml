name: Deploy TikTok OAuth Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/tiktok-oauth/**"
      - ".github/workflows/deploy-tiktok-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: b80e42c7cfa221141abd001fe4abb824
          command: deploy --config cloudflare/tiktok-oauth/wrangler.toml
